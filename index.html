<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArrowHead</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f4ec; color: #172119; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
    .mark { color: #d9232e; font-size: 72px; line-height: 1; }
    h1 { font-size: 48px; margin: 8px 0 12px; }
    p { font-size: 19px; line-height: 1.6; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
    a { color: #fff; background: #1d6b3b; padding: 12px 18px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    @media (prefers-color-scheme: dark) { body { background: #101410; color: #f3f5ef; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">➤</div>
    <h1>ArrowHead</h1>
    <p>An offline inspection camera for iPhone that permanently renders clear visual markers and optional captions into finished photographs.</p>
    <p>ArrowHead has no account, advertising, analytics, cloud service, or subscription.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </nav>
  </main>
</body>
</html>
